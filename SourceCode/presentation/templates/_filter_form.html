<form class="filter-bar" method="GET" action="{{ action_url }}">
    <div class="filter-field filter-grow">
        <label for="filter-q">Tìm kiếm</label>
        <input id="filter-q" type="search" name="q" value="{{ filters.keyword }}" placeholder="Tên xe, mã xe, loại xe…">
    </div>
    <div class="filter-field">
        <label for="filter-type">Loại xe</label>
        <select id="filter-type" name="type_id">
            <option value="">Tất cả</option>
            {% for type in types %}
                <option value="{{ type.typeId }}" {% if filters.type_id == type.typeId %}selected{% endif %}>{{ type.typeName }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="filter-field filter-seats">
        <label for="filter-seats-min">Số chỗ</label>
        <div class="range-pair">
            <input id="filter-seats-min" type="number" name="seats_min" min="2" max="55" value="{{ filters.seats_min or '' }}" placeholder="Từ">
            <span>–</span>
            <input type="number" name="seats_max" min="2" max="55" value="{{ filters.seats_max or '' }}" placeholder="Đến">
        </div>
    </div>
    {% if show_status %}
    <div class="filter-field">
        <label for="filter-status">Trạng thái</label>
        <select id="filter-status" name="status">
            <option value="">Tất cả</option>
            {% for value, label in statuses %}
                <option value="{{ value }}" {% if filters.status == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    {% endif %}
    <div class="filter-field">
        <label for="filter-sort">Sắp xếp</label>
        <select id="filter-sort" name="sort">
            {% for value, label in sorts %}
                <option value="{{ value }}" {% if filters.sort == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="filter-actions">
        <button class="btn btn-primary" type="submit">Áp dụng</button>
        <a class="btn btn-ghost" href="{{ action_url }}">Xóa lọc</a>
    </div>
</form>
