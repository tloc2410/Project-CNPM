{% extends 'base.html' %}
{% block title %}Bảng điều khiển – Group12 Car Rental{% endblock %}

{% block content %}
<section class="container section section-narrow">
    <div class="form-card">
        <p class="eyebrow">BẢNG ĐIỀU KHIỂN</p>
        <h1>Xin chào, {{ session.get('full_name') }}!</h1>
        <p class="page-subtitle">Bạn đã đăng nhập với vai trò <strong>{{ session.get('role', 'CUSTOMER') }}</strong>.</p>
        <div class="dashboard-links">
            <a class="btn btn-primary" href="{{ url_for('cars') }}">Xem danh sách xe</a>
        </div>
    </div>
</section>
{% endblock %}
