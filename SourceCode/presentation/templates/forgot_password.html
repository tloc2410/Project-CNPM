<!DOCTYPE html>
<html lang="en">
<head><title>Forgot Password | Group12 Car Rental</title>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta charset="utf-8"/>
<link href="{{ url_for('static', filename='css/auth.css') }}" rel="stylesheet"/>
</head>
<body>
<div class="forgot_password"><div class="forgot_password-wrapper"><div class="main"><div class="div"></div>
<div class="top-navigation"><a class="link" href="{{ url_for('login') }}"><div class="SVG"><svg aria-hidden="true" class="vector" fill="none" focusable="false" stroke="#64748b" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 4 5 11l7 7M5 11h15"></path></svg></div>
<div class="text">Back to Sign in</div></a></div>
<div class="header-section"><div class="div-wrapper"><div class="text-wrapper">Forgot Password</div></div>
<div class="div-wrapper"><p class="enter-your">Enter your registered email address or phone number and<br/>we'll send you instructions to reset your password.</p></div></div>
<form class="form-section" method="get" onsubmit='event.preventDefault(); alert("Reset password email functionality is not connected to the backend yet.");'><div class="input-group-email-or"><div class="div-wrapper"><label class="label" for="input-1">Email or phone number</label></div>
<div class="container"><div class="input"><input aria-label="Email or phone number" autocomplete="username" class="container-2" id="input-1" name="email_or_phone" placeholder="" required="" type="text"/></div>
<div class="prefix-icon-user"><div class="SVG"><img alt="" class="img" src="{{ url_for('static', filename='images/User.svg') }}"/></div></div></div></div>
<button class="action-button" type="submit"><div class="container-3"><div class="text-2">Send Reset Link</div></div>
<div class="SVG-margin"><div class="SVG-wrapper"><div class="vector-wrapper"><svg aria-hidden="true" class="vector-2" fill="none" focusable="false" stroke="#64748b" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 12h16m-6-6 6 6-6 6"></path></svg></div></div></div></button></form>
<div class="divider-section"><div class="horizontal-divider-wrapper"><div class="horizontal-divider"></div></div>
<div class="background-wrapper"><div class="background"><div class="text-3">OR CONTINUE WITH</div></div></div></div>
<div class="social-auth-section"><button class="div-2" title="Social sign-in requires backend integration" type="button"><img alt="Google" class="google-logo-SVG" src="{{ url_for('static', filename='images/google.svg') }}"/>
<div class="container-4"><div class="text-4">Google</div></div></button>
<button class="div-2" title="Social sign-in requires backend integration" type="button"><div class="apple-logo-SVG"><div class="SVG-wrapper"><div class="vector-wrapper"><img alt="Apple" class="vector-3" src="{{ url_for('static', filename='images/apple.svg') }}"/></div></div></div>
<div class="container-3"><div class="text-4">Apple ID</div></div></button></div>
<div class="footer-section"><div class="switch-to-sign-in"><div class="text-5">Remember password?</div>
<a class="link-sign-in" href="{{ url_for('login') }}">Sign in</a></div>
<div class="security-guarantee"><div class="img-wrapper"><svg aria-hidden="true" class="vector-4" fill="none" focusable="false" stroke="#64748b" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m12 2 8 4v6c0 5-3.3 8.2-8 10-4.7-1.8-8-5-8-10V6z"></path><rect height="5" rx="1" width="6" x="9" y="11"></rect><path d="M10 11V9a2 2 0 0 1 4 0v2"></path></svg></div>
<div class="margin"><div class="container-3"><p class="p">Secure password recovery</p></div></div></div></div></div></div></div>
</body>
</html>
