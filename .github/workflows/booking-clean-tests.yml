name: Booking clean branch tests
on:
  push:
    branches: [feature/order-clean]
  workflow_dispatch:
jobs:
  booking-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SourceCode
    env:
      SECRET_KEY: test-only-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest Test/test_cart_booking.py -v
