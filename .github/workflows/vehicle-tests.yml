name: Vehicle module tests

on:
  push:
    paths:
      - "SourceCode/**"
      - "Database/**"
  pull_request:
    paths:
      - "SourceCode/**"
      - "Database/**"
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SourceCode
    env:
      SECRET_KEY: ci-test-only-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: SourceCode/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run vehicle module unit tests
        run: python -m unittest discover -s Test -p "test_vehicle_*.py" -v
